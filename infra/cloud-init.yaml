#cloud-config
# PreQuit host bootstrap. Target: Ubuntu 22.04/24.04 LTS.
#
# Brings up: Docker Engine + Compose plugin, a non-root deploy user, both
# repos cloned as siblings (matching infra/docker-compose.yml's build
# contexts), a firewall open on 22/80/443, and unattended security updates.
# It does NOT start the stack — that needs infra/.env with real secrets
# (JWT keypair at minimum), which this script deliberately never generates
# or fetches. SSH in and finish that by hand, or wire your own secret
# fetch into runcmd below.

hostname: prequit

users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAA...REPLACE-WITH-YOUR-PUBLIC-KEY... deploy@prequit

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - ufw
  - unattended-upgrades
  - fail2ban

write_files:
  - path: /etc/apt/apt.conf.d/51prequit-unattended
    content: |
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";

runcmd:
  # --- Docker Engine + Compose plugin, from Docker's own apt repo ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture)
    signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu
    $(. /etc/os-release && echo "$VERSION_CODENAME") stable" |
    tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # --- Firewall: SSH + HTTP/HTTPS only. Mongo/Redis/API stay container-internal. ---
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # --- fail2ban on sshd with its stock defaults ---
  - systemctl enable --now fail2ban

  # --- Repos, cloned as siblings so infra's compose build contexts
  #     (../../preQuitBackend, ../..) resolve correctly ---
  - install -d -o deploy -g deploy /srv/prequit
  - sudo -u deploy git clone https://github.com/PRIEYAN/PreQuit.git /srv/prequit/PreQuit
  - sudo -u deploy git clone https://github.com/PRIEYAN/PreQuitBackend.git /srv/prequit/preQuitBackend
  - sudo -u deploy git -C /srv/prequit/PreQuit checkout main
  - sudo -u deploy git -C /srv/prequit/preQuitBackend checkout production-hardening

  # --- Env file placeholder: fill in real secrets before compose up ---
  - sudo -u deploy cp /srv/prequit/PreQuit/infra/.env.example /srv/prequit/PreQuit/infra/.env
  - chmod 600 /srv/prequit/PreQuit/infra/.env

final_message: |
  PreQuit host ready after $UPTIME seconds.
  Next steps (SSH in as deploy):
    1. Edit /srv/prequit/PreQuit/infra/.env — at minimum set
       JWT_PRIVATE_KEY_PEM / JWT_PUBLIC_KEY_PEM (see the comments in that
       file for how to generate the keypair) and CURSOR_HMAC_SECRET.
    2. cd /srv/prequit/PreQuit/infra && docker compose up -d
    3. infra/scripts/smoke-test.sh to verify the stack came up healthy.
