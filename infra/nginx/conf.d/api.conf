proxy_cache_path /var/cache/nginx/prequit levels=1:2 keys_zone=prequit_static:10m
                 max_size=256m inactive=24h use_temp_path=off;

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    add_header X-Content-Type-Options nosniff        always;
    add_header X-Frame-Options        SAMEORIGIN     always;
    add_header Referrer-Policy        no-referrer    always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|woff2?|svg|png|jpg|jpeg|webp|avif|ico)$ {
        root        /usr/share/nginx/html;
        expires     30d;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    location /api/ {
        proxy_pass          http://prequit_api;
        proxy_http_version  1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Request-Id       $request_id;
        proxy_set_header Connection         "";

        proxy_connect_timeout  5s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 10s;

        proxy_buffering       on;
        proxy_buffers         16 16k;
        proxy_busy_buffers_size 32k;

        proxy_pass_header Retry-After;
    }

    location /socket.io/ {
        proxy_pass          http://prequit_api;
        proxy_http_version  1.1;

        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_connect_timeout  5s;
        proxy_send_timeout     7d;
        proxy_read_timeout     7d;

        proxy_buffering off;
    }

    location = /health/live {
        access_log off;
        proxy_pass         http://prequit_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
    }

    location = /health/ready {
        access_log off;
        proxy_pass         http://prequit_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
    }

    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;

        access_log off;
        proxy_pass         http://prequit_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
    }
}
