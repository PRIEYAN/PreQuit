name: prequit

x-api-build: &api-build
  context: ../../preQuitBackend
  dockerfile: Dockerfile

x-api-env: &api-env
  NODE_ENV: production
  MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/?directConnection=true}
  MONGODB_DB: ${MONGODB_DB:-prequit}
  PERSISTENCE_BACKEND: ${PERSISTENCE_BACKEND:-mongo}
  SEARCH_BACKEND: ${SEARCH_BACKEND:-basic}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_BASE_URL: ${API_BASE_URL:-http://localhost/api/v1}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
  JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-}
  JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM:-}
  CURSOR_HMAC_SECRET: ${CURSOR_HMAC_SECRET:-change-me-in-production}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  SMTP_URL: ${SMTP_URL:-smtp://mailhog:1025}
  HTTP_TRUST_PROXY: "true"
  HTTP_CORS_ORIGINS: ${HTTP_CORS_ORIGINS:-}

services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongodb --quiet --eval '
          try { rs.status().ok } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] })
          }
        '
    restart: "no"

  api:
    build: *api-build
    command: ["dist/main/api.js"]
    environment:
      <<: *api-env
      PORT: "4000"
      CLUSTER_ENABLED: "true"
      CLUSTER_WORKERS: ${CLUSTER_WORKERS:-0}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    build: *api-build
    command: ["dist/main/worker.js"]
    environment:
      <<: *api-env
      CLUSTER_ENABLED: "false"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped

  scheduler:
    build: *api-build
    command: ["dist/main/scheduler.js"]
    environment:
      <<: *api-env
      CLUSTER_ENABLED: "false"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    deploy:
      replicas: 1
    stop_grace_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../landing:/usr/share/nginx/html:ro
      - nginx-cache:/var/cache/nginx
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    expose:
      - "1025"
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  mongo-data:
  mongo-config:
  nginx-cache:
